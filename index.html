<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Fixrr — undo the factory defaults</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="header-top">
    <h1>TV Fixrr</h1>
    <img class="brand-logo" src="logo.png" alt="SeaPig Industries">
  </div>
  <p>Turn off the settings that make your TV worse — then set it up right.</p>
  <input id="search" type="search" placeholder="Search brand, model, or symptom — e.g. 'motion blur'" autocomplete="off">
  <div id="count"></div>
  <a class="add-tv" href="https://github.com/seapigindustries-lab/TV-Fixrr/issues/new?template=add-tv.yml" target="_blank" rel="noopener">+ Add missing TV</a>
</header>
<main id="results"></main>
<details id="model-guide">
  <summary>How to find your model number</summary>
  <div id="model-finder-list"></div>
</details>
<footer>Sample data — verify menu paths against your set before relying on them.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
